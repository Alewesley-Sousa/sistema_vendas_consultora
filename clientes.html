<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Clientes - Sistema de Vendas</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        .clientes-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-add {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .table-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 10px 40px 10px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            width: 300px;
            font-size: 14px;
        }

        .search-box::after {
            content: '🔍';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e1e5e9;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .btn-edit, .btn-delete {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: #f39c12;
            color: white;
        }

        .btn-edit:hover {
            background: #e67e22;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-footer {
            text-align: right;
            margin-top: 20px;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .no-clients {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }

            .header-section {
                flex-direction: column;
                gap: 20px;
            }

            .search-box input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="clientes-container">
        <div class="header-section">
            <h1>Gerenciamento de Clientes</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar clientes...">
            </div>
        </div>

        <div class="form-section">
            <h2>Adicionar Novo Cliente</h2>
            <form id="clienteForm">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="E-mail" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <input type="tel" id="telefone" name="telefone" placeholder="Telefone">
                    </div>
                    <div class="form-group">
                        <select id="status" name="status" required>
                            <option value="">Selecione o status</option>
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                            <option value="Pendente">Pendente</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-add">Adicionar Cliente</button>
            </form>
        </div>

        <div class="table-section">
            <div class="table-header">
                <h2>Lista de Clientes</h2>
                <span id="totalClientes">Total: 0 clientes</span>
            </div>
            <table id="clientesTable">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Status</th>
                        <th>Data Cadastro</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="clientesTableBody">
                    <tr>
                        <td colspan="6" class="no-clients">Nenhum cliente cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para editar cliente -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Cliente</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <input type="text" id="editNome" name="nome" placeholder="Nome completo" required>
                </div>
                <div class="form-group">
                    <input type="email" id="editEmail" name="email" placeholder="E-mail" required>
                </div>
                <div class="form-group">
                    <input type="tel" id="editTelefone" name="telefone" placeholder="Telefone">
                </div>
                <div class="form-group">
                    <select id="editStatus" name="status" required>
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('clientes')) || [];
        let editIndex = -1;

        // Função para renderizar a tabela
        function renderTable() {
            const tbody = document.getElementById('clientesTableBody');
            const totalSpan = document.getElementById('totalClientes');

            if (clientes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-clients">Nenhum cliente cadastrado ainda.</td></tr>';
                totalSpan.textContent = 'Total: 0 clientes';
                return;
            }

            tbody.innerHTML = clientes.map((cliente, index) => `
                <tr>
                    <td>${cliente.nome}</td>
                    <td>${cliente.email}</td>
                    <td>${cliente.telefone || '-'}</td>
                    <td><span class="status-${cliente.status.toLowerCase()}">${cliente.status}</span></td>
                    <td>${cliente.dataCadastro}</td>
                    <td>
                        <button class="btn-edit" onclick="editCliente(${index})">Editar</button>
                        <button class="btn-delete" onclick="deleteCliente(${index})">Excluir</button>
                    </td>
                </tr>
            `).join('');

            totalSpan.textContent = `Total: ${clientes.length} cliente${clientes.length > 1 ? 's' : ''}`;
        }

        // Função para adicionar cliente
        document.getElementById('clienteForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;
            const status = document.getElementById('status').value;

            const novoCliente = {
                nome,
                email,
                telefone,
                status,
                dataCadastro: new Date().toLocaleDateString('pt-BR')
            };

            clientes.push(novoCliente);
            localStorage.setItem('clientes', JSON.stringify(clientes));

            this.reset();
            renderTable();

            // Animação de sucesso
            showMessage('Cliente adicionado com sucesso!', 'success');
        });

        // Função para editar cliente
        function editCliente(index) {
            editIndex = index;
            const cliente = clientes[index];

            document.getElementById('editId').value = index;
            document.getElementById('editNome').value = cliente.nome;
            document.getElementById('editEmail').value = cliente.email;
            document.getElementById('editTelefone').value = cliente.telefone;
            document.getElementById('editStatus').value = cliente.status;

            document.getElementById('editModal').style.display = 'flex';
        }

        // Função para salvar edição
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('editNome').value;
            const email = document.getElementById('editEmail').value;
            const telefone = document.getElementById('editTelefone').value;
            const status = document.getElementById('editStatus').value;

            clientes[editIndex] = {
                ...clientes[editIndex],
                nome,
                email,
                telefone,
                status
            };

            localStorage.setItem('clientes', JSON.stringify(clientes));
            closeModal();
            renderTable();
            showMessage('Cliente atualizado com sucesso!', 'success');
        });

        // Função para deletar cliente
        function deleteCliente(index) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                clientes.splice(index, 1);
                localStorage.setItem('clientes', JSON.stringify(clientes));
                renderTable();
                showMessage('Cliente excluído com sucesso!', 'success');
            }
        }

        // Função para fechar modal
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            editIndex = -1;
        }

        // Função para buscar clientes
        document.getElementById('searchInput').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const filteredClientes = clientes.filter(cliente =>
                cliente.nome.toLowerCase().includes(searchTerm) ||
                cliente.email.toLowerCase().includes(searchTerm)
            );

            const tbody = document.getElementById('clientesTableBody');
            if (filteredClientes.length === 0 && searchTerm !== '') {
                tbody.innerHTML = '<tr><td colspan="6" class="no-clients">Nenhum cliente encontrado.</td></tr>';
            } else if (searchTerm === '') {
                renderTable();
            } else {
                tbody.innerHTML = filteredClientes.map((cliente, index) => `
                    <tr>
                        <td>${cliente.nome}</td>
                        <td>${cliente.email}</td>
                        <td>${cliente.telefone || '-'}</td>
                        <td><span class="status-${cliente.status.toLowerCase()}">${cliente.status}</span></td>
                        <td>${cliente.dataCadastro}</td>
                        <td>
                            <button class="btn-edit" onclick="editCliente(${clientes.indexOf(cliente)})">Editar</button>
                            <button class="btn-delete" onclick="deleteCliente(${clientes.indexOf(cliente)})">Excluir</button>
                        </td>
                    </tr>
                `).join('');
            }
        });

        // Função para mostrar mensagens
        function showMessage(message, type) {
            // Criar elemento de mensagem temporária
            const messageEl = document.createElement('div');
            messageEl.textContent = message;
            messageEl.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'success' ? '#27ae60' : '#e74c3c'};
                color: white;
                padding: 15px 20px;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 1001;
                animation: slideIn 0.3s ease;
            `;

            document.body.appendChild(messageEl);

            setTimeout(() => {
                messageEl.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => document.body.removeChild(messageEl), 300);
            }, 3000);
        }

        // Animações CSS para mensagens
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
            .status-ativo { color: #27ae60; font-weight: bold; }
            .status-inativo { color: #e74c3c; font-weight: bold; }
            .status-pendente { color: #f39c12; font-weight: bold; }
        `;
        document.head.appendChild(style);

        // Fechar modal ao clicar fora
        window.addEventListener('click', function(e) {
            const modal = document.getElementById('editModal');
            if (e.target === modal) {
                closeModal();
            }
        });

        // Inicializar tabela
        renderTable();
    </script>
</body>
</html>
