
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Vendas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    :root {
      --primary: #FF6F61; /* Coral */
      --primary-dark: #FF1493; /* Deep Pink */
      --secondary: #FF69B4; /* Hot Pink */
      --dark-sidebar: #2C3E50; /* Azul Petróleo */
      --dark-sidebar-end: #141E30;
      --background: #FDFBFC;
      --gold: #FFD700; /* Dourado */
      --card-bg: #FFFFFF;
      --text: #2C3E50;
      --text-muted: #5d6d7e;
      --radius: 18px; 
      --shadow: 0 10px 25px rgba(0,0,0,0.04); 
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--background);
      margin: 0;
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, var(--dark-sidebar), var(--dark-sidebar-end));
      color: white;
      padding: 30px 20px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border-bottom-left-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
      margin-bottom: 30px;
      border-bottom: 3px solid var(--gold);
    }

    header i { margin-right: 15px; color: var(--gold); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 40px;
      animation: fadeIn 0.6s ease;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 25px;
      transition: color 0.3s;
    }

    .back-btn:hover { color: var(--primary-dark); }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .product-card:hover { transform: translateY(-5px); }

    .product-image {
      height: 180px;
      background: linear-gradient(to bottom, #ffffff, #f9f9f9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 3.5rem;
      opacity: 0.8;
    }

    .product-info {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .product-category {
      font-size: 0.75rem;
      color: var(--primary-dark);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--dark-sidebar);
    }

    .product-price {
      font-size: 1.3rem;
      color: var(--primary);
      font-weight: 700;
      margin-top: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <i class="fas fa-book-open"></i> Nosso Catálogo
  </header>

  <div class="container">
    <a href="dashbord.html" class="back-btn"><i class="fas fa-arrow-left"></i> Voltar ao Dashboard</a>

    <div class="catalog-grid">
      <!-- Exemplo de Produto 1 -->
      <div class="product-card">
        <div class="product-image"><i class="fas fa-spray-can"></i></div>
        <div class="product-info">
          <span class="product-category">Perfumaria</span>
          <div class="product-name">Perfume Essencial Exclusivo</div>
          <div class="product-price">R$ 145,00</div>
        </div>
      </div>

      <!-- Exemplo de Produto 2 -->
      <div class="product-card">
        <div class="product-image"><i class="fas fa-pump-soap"></i></div>
        <div class="product-info">
          <span class="product-category">Corpo</span>
          <div class="product-name">Hidratante Cereja e Avelã</div>
          <div class="product-price">R$ 54,90</div>
        </div>
      </div>

      <!-- Exemplo de Produto 3 -->
      <div class="product-card">
        <div class="product-image"><i class="fas fa-magic"></i></div>
        <div class="product-info">
          <span class="product-category">Maquiagem</span>
          <div class="product-name">Base Matte Alta Cobertura</div>
          <div class="product-price">R$ 39,00</div>
        </div>
      </div>

      <!-- Exemplo de Produto 4 -->
      <div class="product-card">
        <div class="product-image"><i class="fas fa-wine-bottle"></i></div>
        <div class="product-info">
          <span class="product-category">Óleos</span>
          <div class="product-name">Óleo Sève Amêndoas Doces</div>
          <div class="product-price">R$ 72,00</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
