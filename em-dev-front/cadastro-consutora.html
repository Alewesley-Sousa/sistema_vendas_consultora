<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Consultora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    :root {
      --primary: #3498db; 
      --primary-dark: #2980b9; 
      --dark-sidebar: #2f3640;
      --dark-sidebar-end: #1c2025;
      --background: #f0f2f5; 
      --card-bg: #FFFFFF;
      --text: #333333;
      --text-muted: #7f8c8d;
      --radius: 15px; 
      --shadow: 0 4px 12px rgba(0,0,0,0.08); 
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--background);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: var(--text);
    }

    .register-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    .register-header {
      background: linear-gradient(135deg, var(--dark-sidebar), var(--dark-sidebar-end));
      color: white;
      padding: 30px;
      text-align: center;
    }

    .register-header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .register-header p {
      margin: 10px 0 0;
      opacity: 0.8;
      font-size: 0.95rem;
    }

    form {
      padding: 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--dark-sidebar);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .status {
      background: #e1f5fe;
      color: var(--primary-dark);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
      border: 1px solid rgba(52, 152, 219, 0.2);
    }

    button {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      font-size: 1.1rem;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <h1><i class="fas fa-user-tie"></i> Cadastro de Consultora</h1>
      <p>Preencha seus dados para iniciar na nossa rede</p>
    </div>

    <form>
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" placeholder="Ex: Maria Oliveira">
      </div>

      <div class="form-group">
        <label>E-mail Corporativo</label>
        <input type="email" placeholder="email@exemplo.com">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>CPF</label>
          <input type="text" placeholder="000.000.000-00">
        </div>
        <div class="form-group">
          <label>Telefone / WhatsApp</label>
          <input type="tel" placeholder="(85) 99999-9999">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>CEP</label>
          <input type="text" placeholder="00000-000">
        </div>
        <div class="form-group">
          <label>Senha de Acesso</label>
          <input type="password" placeholder="Mínimo 8 caracteres">
        </div>
      </div>

      <div class="status">
        <i class="fas fa-info-circle"></i> Status da Conta: Pré-Cadastro
      </div>

      <button type="submit">
        <i class="fas fa-check-circle"></i> Concluir Cadastro
      </button>
    </form>
  </div>
</body>
</html>
