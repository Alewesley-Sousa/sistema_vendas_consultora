<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Sistema de Vendas Consultora</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        .register-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-in-out;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .register-header p {
            color: #666;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .role-selector {
            margin-bottom: 25px;
        }

        .role-selector h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .role-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .role-option {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .role-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .role-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }

        .role-option .role-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .role-option .role-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .role-option .role-desc {
            font-size: 12px;
            color: #666;
        }

        .btn-register {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(39, 174, 96, 0.3);
        }

        .btn-register:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .password-strength {
            margin-top: 5px;
            font-size: 12px;
        }

        .strength-weak { color: #e74c3c; }
        .strength-medium { color: #f39c12; }
        .strength-strong { color: #27ae60; }

        .strength-bar {
            height: 4px;
            background: #e1e5e9;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .role-options {
                flex-direction: column;
            }

            .role-option {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>Criar Nova Conta</h1>
            <p>Junte-se ao Sistema de Vendas Consultora</p>
        </div>

        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="firstName" name="firstName" required placeholder=" ">
                    <label for="firstName">Nome</label>
                </div>
                <div class="form-group">
                    <input type="text" id="lastName" name="lastName" required placeholder=" ">
                    <label for="lastName">Sobrenome</label>
                </div>
            </div>

            <div class="form-group">
                <input type="email" id="email" name="email" required placeholder=" ">
                <label for="email">E-mail</label>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <input type="password" id="password" name="password" required placeholder=" ">
                    <label for="password">Senha</label>
                    <div class="password-strength" id="passwordStrength"></div>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder=" ">
                    <label for="confirmPassword">Confirmar Senha</label>
                </div>
            </div>

            <div class="role-selector">
                <h3>Selecione seu papel no sistema:</h3>
                <div class="role-options">
                    <div class="role-option" data-role="cliente">
                        <div class="role-icon">👤</div>
                        <div class="role-title">Cliente</div>
                        <div class="role-desc">Acesso limitado às compras</div>
                    </div>
                    <div class="role-option" data-role="funcionario">
                        <div class="role-icon">👨‍💼</div>
                        <div class="role-title">Funcionário</div>
                        <div class="role-desc">Gerenciamento de vendas</div>
                    </div>
                    <div class="role-option" data-role="admin">
                        <div class="role-icon">👑</div>
                        <div class="role-title">Administrador</div>
                        <div class="role-desc">Controle total do sistema</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-register" id="btnRegister" disabled>
                Criar Conta
            </button>
        </form>

        <div class="login-link">
            <a href="login.html">Já tem uma conta? Faça login</a>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Criando sua conta...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const btnRegister = document.getElementById('btnRegister');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordStrength = document.getElementById('passwordStrength');
            const strengthFill = document.getElementById('strengthFill');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const loading = document.getElementById('loading');
            let selectedRole = null;

            // Animação de digitação no título
            const title = document.querySelector('.register-header h1');
            const originalText = title.textContent;
            title.textContent = '';
            let i = 0;

            function typeWriter() {
                if (i < originalText.length) {
                    title.textContent += originalText.charAt(i);
                    i++;
                    setTimeout(typeWriter, 100);
                }
            }
            typeWriter();

            // Seleção de papel
            document.querySelectorAll('.role-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedRole = this.dataset.role;
                    validateForm();
                });
            });

            // Validação de senha em tempo real
            passwordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
                validatePasswords();
                validateForm();
            });

            confirmPasswordInput.addEventListener('input', function() {
                validatePasswords();
                validateForm();
            });

            // Validação de outros campos
            document.querySelectorAll('input[required]').forEach(input => {
                input.addEventListener('input', validateForm);
            });

            function checkPasswordStrength(password) {
                let strength = 0;
                let feedback = [];

                if (password.length >= 8) strength++;
                else feedback.push('Pelo menos 8 caracteres');

                if (/[a-z]/.test(password)) strength++;
                else feedback.push('Letra minúscula');

                if (/[A-Z]/.test(password)) strength++;
                else feedback.push('Letra maiúscula');

                if (/[0-9]/.test(password)) strength++;
                else feedback.push('Número');

                if (/[^A-Za-z0-9]/.test(password)) strength++;
                else feedback.push('Caractere especial');

                let strengthText = '';
                let strengthClass = '';
                let width = '0%';

                switch(strength) {
                    case 0:
                    case 1:
                        strengthText = 'Muito fraca';
                        strengthClass = 'strength-weak';
                        width = '20%';
                        break;
                    case 2:
                        strengthText = 'Fraca';
                        strengthClass = 'strength-weak';
                        width = '40%';
                        break;
                    case 3:
                        strengthText = 'Média';
                        strengthClass = 'strength-medium';
                        width = '60%';
                        break;
                    case 4:
                        strengthText = 'Forte';
                        strengthClass = 'strength-strong';
                        width = '80%';
                        break;
                    case 5:
                        strengthText = 'Muito forte';
                        strengthClass = 'strength-strong';
                        width = '100%';
                        break;
                }

                passwordStrength.textContent = strengthText;
                passwordStrength.className = `password-strength ${strengthClass}`;
                strengthFill.style.width = width;
                strengthFill.style.backgroundColor = strengthClass.includes('weak') ? '#e74c3c' :
                                                   strengthClass.includes('medium') ? '#f39c12' : '#27ae60';

                return strength >= 3;
            }

            function validatePasswords() {
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                const isValid = password === confirmPassword && password.length > 0;

                confirmPasswordInput.style.borderColor = isValid ? '#27ae60' :
                                                        confirmPassword ? '#e74c3c' : '#e1e5e9';

                if (confirmPassword && !isValid) {
                    showFieldError(confirmPasswordInput, 'As senhas não coincidem');
                } else {
                    hideFieldError(confirmPasswordInput);
                }

                return isValid;
            }

            function validateForm() {
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const isEmailValid = emailRegex.test(email);
                const isPasswordStrong = checkPasswordStrength(password);
                const isPasswordMatch = password === confirmPassword;
                const isFormValid = firstName && lastName && isEmailValid && isPasswordStrong &&
                                  isPasswordMatch && selectedRole;

                btnRegister.disabled = !isFormValid;
                btnRegister.style.opacity = isFormValid ? '1' : '0.6';

                return isFormValid;
            }

            function showFieldError(input, message) {
                let errorEl = input.parentNode.querySelector('.field-error');
                if (!errorEl) {
                    errorEl = document.createElement('div');
                    errorEl.className = 'field-error';
                    errorEl.style.cssText = `
                        color: #e74c3c;
                        font-size: 12px;
                        margin-top: 5px;
                        animation: fadeIn 0.3s ease;
                    `;
                    input.parentNode.appendChild(errorEl);
                }
                errorEl.textContent = message;
            }

            function hideFieldError(input) {
                const errorEl = input.parentNode.querySelector('.field-error');
                if (errorEl) {
                    errorEl.remove();
                }
            }

            // Submissão do formulário
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();

                if (!validateForm()) return;

                // Mostrar loading
                loading.style.display = 'block';
                btnRegister.disabled = true;
                btnRegister.textContent = 'Criando...';

                const userData = {
                    firstName: document.getElementById('firstName').value.trim(),
                    lastName: document.getElementById('lastName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    password: passwordInput.value,
                    role: selectedRole,
                    createdAt: new Date().toISOString(),
                    id: Date.now().toString()
                };

                // Simular criação de conta
                setTimeout(() => {
                    try {
                        // Salvar usuário
                        const users = JSON.parse(localStorage.getItem('users')) || [];
                        const existingUser = users.find(u => u.email === userData.email);

                        if (existingUser) {
                            throw new Error('Este e-mail já está cadastrado!');
                        }

                        users.push(userData);
                        localStorage.setItem('users', JSON.stringify(users));

                        // Sucesso
                        successMessage.textContent = 'Conta criada com sucesso! Redirecionando para login...';
                        successMessage.style.display = 'block';
                        errorMessage.style.display = 'none';

                        // Animação de sucesso
                        registerForm.style.animation = 'bounce 0.5s ease';

                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);

                    } catch (error) {
                        errorMessage.textContent = error.message;
                        errorMessage.style.display = 'block';
                        successMessage.style.display = 'none';

                        // Animação de erro
                        registerForm.style.animation = 'shake 0.5s ease';
                    }

                    // Esconder loading
                    loading.style.display = 'none';
                    btnRegister.disabled = false;
                    btnRegister.textContent = 'Criar Conta';
                }, 2000);
            });

            // Animações CSS adicionais
            const additionalStyles = `
                @keyframes bounce {
                    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
                    40% { transform: translateY(-10px); }
                    60% { transform: translateY(-5px); }
                }

                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                    20%, 40%, 60%, 80% { transform: translateX(5px); }
                }

                .field-error {
                    animation: fadeIn 0.3s ease;
                }

                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(-10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
            `;

            const style = document.createElement('style');
            style.textContent = additionalStyles;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
